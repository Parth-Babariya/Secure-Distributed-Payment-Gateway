syntax = "proto3";
package bank;

// Participant side of the two-phase commit. Only the payment gateway may call
// these methods (enforced by its mTLS certificate identity).
service Bank {
  rpc GetBalance(BalanceRequest) returns (BalanceResponse);

  // Phase 1: vote. A yes vote is durable: the bank has reserved the funds
  // (debit) or validated the account (credit) and will honour either decision.
  rpc PrepareTransaction(PrepareRequest) returns (PrepareResponse);

  // Phase 2. Both calls are idempotent so the coordinator can retry them.
  rpc CommitTransaction(DecisionRequest) returns (DecisionResponse);
  rpc AbortTransaction(DecisionRequest) returns (DecisionResponse);
}

enum Operation {
  OPERATION_UNSPECIFIED = 0;
  DEBIT = 1;
  CREDIT = 2;
}

message BalanceRequest {
  string account_number = 1;
}

message BalanceResponse {
  int64 balance_paise = 1;    // settled balance
  int64 available_paise = 2;  // balance minus funds reserved by prepared debits
}

message PrepareRequest {
  string transaction_id = 1;
  string account_number = 2;
  int64 amount_paise = 3;
  Operation operation = 4;
}

message PrepareResponse {
  bool vote_commit = 1;
  string message = 2;
}

message DecisionRequest {
  string transaction_id = 1;
  Operation operation = 2;
}

message DecisionResponse {
  bool success = 1;
  string message = 2;
}
