syntax = "proto3";

service PaymentGateway {
    rpc RegisterBank (RegisterBankRequest) returns (RegisterBankResponse);
    rpc AuthenticateClient (AuthRequest) returns (AuthResponse);
    rpc CheckBalance (BalanceRequest) returns (BalanceResponse);
    rpc ProcessPayment (PaymentRequest) returns (PaymentResponse);
    rpc GetPaymentStatus (PaymentStatusRequest) returns (PaymentResponse);
    rpc ViewTransactionHistory (TransactionHistoryRequest) returns (TransactionHistoryResponse);
    rpc LogoutClient (LogoutRequest) returns (LogoutResponse);
}

message RegisterBankRequest {
    string bank_name = 1;
    int32 bank_port = 2;
    string bank_host = 3;  // defaults to localhost when empty
}

message RegisterBankResponse {
    bool success = 1;
    string message = 2;
}

message AuthRequest {
    string username = 1;
    string password = 2;
}

message AuthResponse {
    bool authenticated = 1;
    string token = 2;
    string message = 3;
}

message BalanceRequest {
    string bank_name = 1;
}

message BalanceResponse {
    int64 balance_paise = 1;
    int64 available_paise = 2;
}

// Amounts are integer paise: floating point is never used for money.
message PaymentRequest {
    string transaction_id = 1;  // client-generated idempotency key
    string sender_bank_name = 2;
    string receiver_username = 3;
    string receiver_bank_name = 4;
    int64 amount_paise = 5;
}

message PaymentResponse {
    bool success = 1;
    string message = 2;
    string transaction_id = 3;
    // PREPARING, COMMITTING, COMMITTED, ABORTING or ABORTED. COMMITTING means
    // the commit decision is durable and settlement is still being retried.
    string status = 4;
}

message PaymentStatusRequest {
    string transaction_id = 1;
}

message LogoutRequest {}

message LogoutResponse {
    bool success = 1;
    string message = 2;
}

message TransactionHistoryRequest {}

message Transaction {
    string transaction_id = 1;
    string from_bank = 2;
    string to_bank = 3;
    string from_account_no = 4;  // sender's view only
    string from_user_id = 5;     // receiver's view only
    string to_user_id = 6;       // sender's view only
    int64 amount_paise = 7;
    string timestamp = 8;
    string status = 9;
    string message = 10;
}

message TransactionHistoryResponse {
    repeated Transaction transactions = 1;
}
