# Gateway + three banks, each with its own mTLS identity and durable volume.
#   docker compose up --build -d
#   docker compose run --rm client
#
# The one-shot `certs` service creates the CA and writes each component's key
# into a separate volume. Every runtime container mounts only its own volume,
# which holds its key, its certificate and ca.crt. The CA's private key lives
# in the `certs-ca` volume, which no runtime container mounts.
x-common: &common
  build: .
  image: secure-payment-gateway
  environment: &env
    PG_GATEWAY_ADDRESS: gateway:50052
    PG_JWT_SECRET: ${PG_JWT_SECRET:-change-me-to-a-long-random-secret-in-production}
  depends_on:
    certs:
      condition: service_completed_successfully

services:
  certs:
    build: .
    image: secure-payment-gateway
    command: python /app/scripts/gen_certs.py --out /certs --split
    volumes:
      - certs-ca:/certs/ca
      - certs-gateway:/certs/gateway
      - certs-hdfc:/certs/hdfc
      - certs-icici:/certs/icici
      - certs-sbi:/certs/sbi
      - certs-client:/certs/client

  gateway:
    <<: *common
    command: python payment_gateway.py
    ports:
      - "50052:50052"
    volumes:
      - certs-gateway:/certs:ro
      - gateway-data:/data

  hdfc:
    <<: *common
    command: python bank_server.py HDFC 60051
    environment:
      <<: *env
      PG_BANK_HOST: hdfc
    volumes:
      - certs-hdfc:/certs:ro
      - hdfc-data:/data

  icici:
    <<: *common
    command: python bank_server.py ICICI 60052
    environment:
      <<: *env
      PG_BANK_HOST: icici
    volumes:
      - certs-icici:/certs:ro
      - icici-data:/data

  sbi:
    <<: *common
    command: python bank_server.py SBI 60053
    environment:
      <<: *env
      PG_BANK_HOST: sbi
    volumes:
      - certs-sbi:/certs:ro
      - sbi-data:/data

  client:
    <<: *common
    command: python /app/client/client.py
    profiles: ["client"]
    stdin_open: true
    tty: true
    environment:
      <<: *env
      PG_OFFLINE_QUEUE: /tmp/offline_payments.json
    volumes:
      - certs-client:/certs:ro

volumes:
  certs-ca:
  certs-gateway:
  certs-hdfc:
  certs-icici:
  certs-sbi:
  certs-client:
  gateway-data:
  hdfc-data:
  icici-data:
  sbi-data:
